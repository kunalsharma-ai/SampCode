name: CI

# Fits GitHub Free for a private repository (2,000 Actions minutes a month): a newer push cancels
# the run it replaces, every job has a time limit, and the docker compose build (the heaviest job)
# runs on main and on demand rather than on every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Set the repository variable CI_RUNNER to "self-hosted" to run on your own machine, which costs
    # no Actions minutes (it needs Docker for the MongoDB container). Default: GitHub's runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # MongoDB as a one-member replica set (Prisma needs one for transactions). A service container
      # cannot be given --replSet, so it is started here.
      # GLIBC_TUNABLES: mongod 8.0 refuses to start on the runners' Linux 6.19+/7.x kernels
      # (SERVER-121912) unless glibc owns rseq. The cost is tcmalloc per-thread instead of per-CPU
      # caches, which does not matter for tests. Drop it once a mongo:8.0 tag starts there unaided.
      - name: Start MongoDB
        run: |
          trap 'docker ps -a; docker logs mongo 2>&1 | tail -60' ERR
          docker run -d --name mongo -p 27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0; sleep 2; done
          false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @zapx/e2e exec playwright install --with-deps chromium
      - run: set -a && . ./.env && set +a && pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results

  # Known vulnerabilities in dependencies fail the build at high severity.
  audit:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm audit --prod --audit-level high

  # Builds the production images and boots the whole stack with docker compose.
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The API refuses to start in production with the example secrets or insecure cookies, so
      # the smoke test gets its own random secrets (compose reads .env for these variables).
      - name: Generate production-grade settings
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_KEY=$(openssl rand -hex 32)"
            echo "SIGNING_KEYS_SECRET=$(openssl rand -hex 32)"
            echo "COOKIE_SECURE=true"
          } > .env
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for API, studio, runtime and interviewer app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health && curl -fsS -o /dev/null http://localhost:3000/login \
              && curl -fsS -o /dev/null http://localhost:5173/ && curl -fsS http://localhost:5173/api/health \
              && curl -fsS -o /dev/null http://localhost:5174/sw.js && curl -fsS http://localhost:5174/api/health; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs --tail 80; exit 1
      - if: always()
        run: docker compose down -v
