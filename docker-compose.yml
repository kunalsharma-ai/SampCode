# Full SampCode stack on one machine, no cloud services needed:
#   docker compose up --build
# Studio http://localhost:3000 · respondent runtime http://localhost:5173 · interviewer app http://localhost:5174 · API http://localhost:4000/api
# For development with hot reload, run only the database: docker compose up -d mongo
name: zapx

x-api-env: &api-env
  DATABASE_URL: mongodb://mongo:27017/zapx?replicaSet=rs0&maxPoolSize=20
  JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
  SECRETS_KEY: ${SECRETS_KEY:-local-compose-secrets-key-change-me-012345}
  SIGNING_KEYS_SECRET: ${SIGNING_KEYS_SECRET:-}
  RUNTIME_BASE_URL: ${RUNTIME_BASE_URL:-http://localhost:5173}
  CAPI_APP_URL: ${CAPI_APP_URL:-http://localhost:5174}
  STUDIO_URL: ${STUDIO_URL:-http://localhost:3000}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PRICING: ${AI_PRICING:-}
  NODE_ENV: production
  FILES_DIR: /data/files

services:
  # A one-member replica set (Prisma needs one for transactions). The health check also starts it the
  # first time. The member is announced as "mongo"; from the host, connect with
  # mongodb://localhost:27017/zapx?replicaSet=rs0&directConnection=true (or add "127.0.0.1 mongo" to /etc/hosts).
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: [mongodata:/data/db]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    build: { context: ., target: migrate }
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., target: api }
    environment:
      <<: *api-env
      # The worker service below runs jobs, callbacks and webhooks.
      JOB_WORKER: 'off'
      CALLBACK_WORKER: 'off'
    ports: ['4000:4000']
    volumes: [files:/data/files]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    environment: *api-env
    volumes: [files:/data/files]
    depends_on:
      migrate: { condition: service_completed_successfully }

  studio:
    build: { context: ., target: studio }
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

  runtime:
    build: { context: ., target: runtime }
    ports: ['5173:80']
    depends_on:
      api: { condition: service_healthy }

  capi:
    build: { context: ., target: capi }
    ports: ['5174:80']
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongodata:
  files:
